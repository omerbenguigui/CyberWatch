[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwatch-siem"
version = "1.0.0"
description = "A lightweight security monitoring and alerting platform built with Python and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Omer Ben Gigi" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "bandit>=1.8,<2.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
cyberwatch-demo = "scripts.generate_demo_data:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
